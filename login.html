<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — CivicEye AI+</title>
<script>(function(){try{var t=localStorage.getItem('civiceye_theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px 0; }
  .auth-wrap { width: 100%; max-width: 420px; padding: var(--sp-5); position: relative; }
  .auth-theme-toggle { position: absolute; top: 0; right: var(--sp-5); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: var(--sp-6); box-shadow: var(--shadow-card); }
  .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: var(--sp-6); text-decoration:none; color: var(--text);}
  .auth-brand span { font-family: var(--font-display); font-size: 1.2rem; }
  .role-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .role-grid button { border:1px solid var(--border); background: var(--surface); padding: 9px 8px; border-radius: var(--radius-s); font-size:12px; font-weight:600; cursor:pointer; color: var(--text-muted); text-align:left; transition: border-color .12s ease, background-color .12s ease, color .12s ease; }
  .role-grid button:hover { border-color: var(--button-secondary-hover-border); }
  .role-grid button.active { border-color: var(--accent-text); color: var(--text); background: var(--surface-alt); }
  .auth-foot { text-align:center; font-size: var(--step--1); color: var(--text-muted); margin-top: var(--sp-5); }
  .auth-banner { border-radius: var(--radius-s); padding: 10px 12px; font-size: 13px; margin-bottom: var(--sp-4); display:none; }
  .auth-banner.error { background: var(--soft-brick-bg); color: var(--soft-brick-text); }
  .auth-banner.info { background: var(--soft-teal-bg); color: var(--soft-teal-text); }
  .tabs { display:flex; gap: var(--sp-5); margin-bottom: var(--sp-5); border-bottom: 1px solid var(--border); }
  .tabs button { background:none; border:none; padding: 0 0 10px; font-weight:600; font-size: 14px; color: var(--text-muted); cursor:pointer; border-bottom: 2px solid transparent; margin-bottom:-1px; transition: color .12s ease, border-color .12s ease; }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--text); border-color: var(--accent-text); }
  #field-org, #field-email-login { display:none; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-theme-toggle" data-theme-toggle-slot></div>
  <div class="auth-card">
    <a class="auth-brand" href="index.html">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="4.2" fill="currentColor"/><path d="M16 3.5V9M16 23V28.5M3.5 16H9M23 16H28.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>CivicEye AI+</span>
    </a>

    <div class="tabs">
      <button type="button" id="tab-login" class="active">Log in</button>
      <button type="button" id="tab-signup">Sign up</button>
    </div>

    <div id="auth-banner" class="auth-banner"></div>

    <form id="login-form">
      <div class="field">
        <label for="login-identifier">Email or username</label>
        <input type="text" id="login-identifier" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
    </form>

    <form id="signup-form" style="display:none;">
      <div class="field">
        <label for="su-username">Username</label>
        <input type="text" id="su-username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" autocomplete="new-password" minlength="8" required />
        <div class="field-hint">At least 8 characters.</div>
      </div>
      <div class="field" id="field-org">
        <label for="su-org">Organization name</label>
        <input type="text" id="su-org" />
      </div>
      <div class="field">
        <label>Account type</label>
        <div class="role-grid" id="role-grid">
          <button type="button" data-role="citizen" class="active">Citizen</button>
          <button type="button" data-role="researcher">Researcher / Analyst</button>
          <button type="button" data-role="organization">Organization</button>
          <button type="button" data-role="platform_admin">Platform Admin</button>
          <button type="button" data-role="data_admin">Data &amp; Intelligence Admin</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
    </form>

    <p class="auth-foot">Connects to the real CivicEye backend at <code id="api-base"></code>.</p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/theme.js"></script>
<script src="js/login.js"></script>
</body>
</html>
